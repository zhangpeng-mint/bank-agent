[project]
name = "bankdev-agent"
version = "0.1.0"
description = "Evidence-first, read-only analysis foundation for bank development projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bankdev = "bankdev_agent.cli:main"

[tool.setuptools.package-data]
bankdev_agent = ["web_static/*.html", "web_static/*.css", "web_static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
